{% extends "core/base.html" %}

{% block title %}{{ case.title }} | CASE AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="glass-card content-card">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3 mb-4">
                <div>
                    <h2 class="section-title">{{ case.title }}</h2>
                    <div class="section-subtitle">Подробная информация по выбранному судебному делу</div>
                </div>
                <div class="badge text-bg-light fs-6 px-3 py-2">
                    {{ case.date }}
                </div>
            </div>

            <div class="p-4 rounded-4 border bg-light-subtle" style="white-space: pre-wrap; line-height: 1.7;">
                {{ case.text }}
            </div>

            <div class="mt-4 d-flex gap-2 flex-wrap">
                <a href="{% url 'case_list' %}" class="btn btn-soft">← Назад к списку дел</a>
                <a href="{% url 'analyze_case' %}" class="btn btn-main">Анализировать дело</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
