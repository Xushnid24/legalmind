{% extends "core/base.html" %}

{% block title %}Создать дело | CASE AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card content-card">
            <div class="mb-4">
                <h2 class="section-title">➕ Создать новое дело</h2>
                <div class="section-subtitle">Добавьте название и текст судебного дела</div>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Название дела</label>
                    <input type="text" name="title" class="form-control" placeholder="Например: Спор о возврате денежных средств" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Текст дела</label>
                    <textarea name="text" rows="10" class="form-control" placeholder="Введите подробное описание дела..." required></textarea>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-main">Сохранить дело</button>
                    <a href="{% url 'case_list' %}" class="btn btn-soft">Назад</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
