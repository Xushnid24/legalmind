{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CASE AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-soft: #111827;
            --panel: rgba(255,255,255,0.92);
            --panel-dark: #1e293b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #06b6d4;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --text-main: #0f172a;
            --text-soft: #64748b;
            --border-soft: rgba(148, 163, 184, 0.22);
            --shadow-main: 0 20px 50px rgba(15, 23, 42, 0.15);
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.28), transparent 28%),
                radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.22), transparent 30%),
                linear-gradient(135deg, #e0e7ff 0%, #f8fafc 45%, #eef2ff 100%);
        }

        .main-navbar {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.78);
            border-bottom: 1px solid rgba(255,255,255,0.45);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 0.3px;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: #fff;
            box-shadow: 0 10px 25px rgba(49, 46, 129, 0.25);
        }

        .nav-link {
            font-weight: 600;
            color: #334155 !important;
            border-radius: 12px;
            padding: 10px 14px !important;
            transition: 0.25s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(79, 70, 229, 0.08);
            color: var(--primary) !important;
        }

        .page-shell {
            padding: 34px 0 42px;
        }

        .hero-panel {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-xl);
            padding: 42px 34px;
            color: #fff;
            background:
                linear-gradient(135deg, rgba(15,23,42,0.9), rgba(79,70,229,0.92)),
                url('https://images.unsplash.com/photo-1589829085413-56db5bbf3c54?auto=format&fit=crop&w=1600&q=80') center/cover;
            box-shadow: var(--shadow-main);
            margin-bottom: 28px;
        }

        .hero-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(15,23,42,0.15), rgba(255,255,255,0.02));
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 760px;
        }

        .hero-badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.16);
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        .hero-text {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.86);
            margin-bottom: 0;
        }

        .glass-card,
        .soft-card {
            border: 1px solid rgba(255,255,255,0.42);
            border-radius: var(--radius-xl);
            background: var(--panel);
            box-shadow: var(--shadow-main);
        }

        .glass-card {
            backdrop-filter: blur(12px);
        }

        .section-card {
            padding: 24px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
        }

        .section-subtitle {
            margin-top: 4px;
            color: var(--text-soft);
            font-size: 0.95rem;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 12px 18px;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.22);
        }

        .btn-main:hover {
            background: linear-gradient(135deg, var(--primary-hover), #4f46e5);
            color: #fff;
        }

        .btn-soft {
            background: rgba(79, 70, 229, 0.08);
            color: var(--primary);
            border: 1px solid rgba(79, 70, 229, 0.15);
            border-radius: 14px;
            font-weight: 700;
        }

        .btn-soft:hover {
            background: rgba(79, 70, 229, 0.12);
            color: var(--primary);
        }

        .btn-danger-soft {
            background: rgba(220, 38, 38, 0.08);
            color: var(--danger);
            border: 1px solid rgba(220, 38, 38, 0.12);
            border-radius: 12px;
            font-weight: 700;
        }

        .btn-danger-soft:hover {
            background: rgba(220, 38, 38, 0.14);
            color: #b91c1c;
        }

        .table-modern {
            margin-bottom: 0;
        }

        .table-modern thead th {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #fff;
            border: none;
            padding: 15px 16px;
            font-size: 0.94rem;
        }

        .table-modern tbody tr {
            transition: 0.22s ease;
        }

        .table-modern tbody tr:hover {
            background: rgba(79, 70, 229, 0.04);
        }

        .table-modern td {
            vertical-align: middle;
            padding: 16px;
            border-color: rgba(148, 163, 184, 0.14);
        }

        .case-link {
            font-weight: 700;
            color: #1e293b;
            text-decoration: none;
        }

        .case-link:hover {
            color: var(--primary);
        }

        .stats-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            padding: 18px;
            border-radius: 18px;
            background: rgba(255,255,255,0.74);
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
        }

        .stat-label {
            color: var(--text-soft);
            font-size: 0.92rem;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .tool-card {
            padding: 20px;
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            min-height: 165px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 35px rgba(15,23,42,0.14);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            color: #fff;
            box-shadow: 0 22px 38px rgba(15,23,42,0.18);
        }

        .tool-card h5 {
            font-weight: 800;
            margin-bottom: 8px;
        }

        .tool-card p {
            margin-bottom: 0;
            opacity: 0.92;
        }

        .tool-analyze {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }

        .tool-search {
            background: linear-gradient(135deg, #0f766e, #06b6d4);
        }

        .tool-doc {
            background: linear-gradient(135deg, #b45309, #f59e0b);
        }

        .side-panel {
            padding: 24px;
            height: 100%;
        }

        .side-panel-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .side-panel-subtitle {
            color: var(--text-soft);
            font-size: 0.94rem;
            margin-bottom: 18px;
        }

        .copied-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .copied-item {
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 14px;
            background: rgba(248, 250, 252, 0.88);
        }

        .copied-item-title {
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
        }

        .copied-item-title:hover {
            color: var(--primary);
        }

        .copied-meta {
            font-size: 0.86rem;
            color: var(--text-soft);
            margin-top: 6px;
        }

        .empty-box {
            border: 1px dashed rgba(148, 163, 184, 0.45);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-soft);
            background: rgba(248,250,252,0.7);
        }

        .form-control,
        textarea.form-control,
        input.form-control {
            border-radius: 14px;
            border: 1px solid rgba(148,163,184,0.35);
            padding: 12px 14px;
            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: rgba(79,70,229,0.45);
            box-shadow: 0 0 0 0.2rem rgba(79,70,229,0.12) !important;
        }

        .result-box {
            margin-top: 22px;
            padding: 20px;
            border-radius: 18px;
            background: #f8fafc;
            border: 1px solid rgba(148,163,184,0.22);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .content-card {
            padding: 28px;
        }

        .footer-clean {
            margin-top: 36px;
            padding: 22px 0 34px;
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
        }

        @media (max-width: 992px) {
            .tools-grid,
            .stats-strip {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .hero-panel {
                padding: 28px 20px;
            }

            .section-card,
            .content-card,
            .side-panel {
                padding: 18px;
            }

            .hero-title {
                font-size: 2rem;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg main-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand text-decoration-none" href="{% url 'case_list' %}">
            <span class="brand-pill">⚖️ CASE AI</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'case_list' %}active{% endif %}" href="{% url 'case_list' %}">
                        Дела
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'case_create' %}active{% endif %}" href="{% url 'case_create' %}">
                        Создать
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'analyze_case' %}active{% endif %}" href="{% url 'analyze_case' %}">
                        Анализ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'search_cases' %}active{% endif %}" href="{% url 'search_cases' %}">
                        Поиск
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'generate_document' %}active{% endif %}" href="{% url 'generate_document' %}">
                        Документы
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="page-shell">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</div>

<footer class="footer-clean">
    <div class="container">
        &copy; 2025 CASE AI — Судебная аналитика нового поколения
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
